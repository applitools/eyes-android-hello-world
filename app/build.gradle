plugins {
    id 'com.android.application'
}

android {
    namespace 'com.applitools.helloworld.android'
    compileSdk 37

    defaultConfig {
        applicationId "com.applitools.helloworld.android"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The tests read the Applitools API key at build time: APPLITOOLS_API_KEY in the environment, or
        // applitoolsApiKey in ~/.gradle/gradle.properties (handy when Android Studio does not inherit the shell).
        buildConfigField "String", "APPLITOOLS_API_KEY", "\"" + (System.getenv("APPLITOOLS_API_KEY") ?: project.findProperty("applitoolsApiKey") ?: "") + "\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.gms:play-services-maps:20.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'

    androidTestImplementation "com.applitools:eyes-android-espresso:$eyesEspressoVersion"
    // The preview SDK needs the matching NML preview; the debug SDK publication asks for applitools-android-core:+.
    androidTestImplementation("com.applitools:applitools-android-core") { version { strictly nmlVersion } }
    // The SDK's Target.region(...) has a Compose SemanticsMatcher overload; javac needs the class to resolve any overload.
    androidTestCompileOnly 'androidx.compose.ui:ui-test:1.11.4'
//    androidTestImplementation 'com.applitools:applitools-android-opencv-wrapper:latest.release'
}
