pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Preview builds of the Espresso SDK published with `./gradlew publishDebugPublicationToMavenLocal`.
        mavenLocal()
        google()
        mavenCentral()
        maven {
            url 'https://applitools.jfrog.io/artifactory/Android/'
        }
    }
}
rootProject.name = "eyes-android-hello-world"
include ':app'
